name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npx cap sync android
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - run: rm -rf ~/.gradle/caches ~/.gradle/wrapper
      
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
      
      - name: Build Release APK (retry up to 3x)
        run: |
          cd android && chmod +x gradlew
          success=false
          for i in 1 2 3; do
            if ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/upload-keystore.jks \
              -Pandroid.injected.signing.store.password=euroclub123 \
              -Pandroid.injected.signing.key.alias=upload \
              -Pandroid.injected.signing.key.password=euroclub123 \
              --no-daemon --no-parallel --max-workers=1 --refresh-dependencies; then
              success=true
              break
            fi
            echo "Attempt $i failed, retrying..."
            rm -rf ~/.gradle/caches
            sleep 5
          done
          if [ "$success" != "true" ]; then
            echo "All build attempts failed"
            exit 1
          fi
      
      - name: List release APK outputs
        run: find android/app/build/outputs -type f
        if: always()
      
      - uses: actions/upload-artifact@v4
        with:
          name: EuroClub-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
