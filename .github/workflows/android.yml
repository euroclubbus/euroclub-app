name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - run: rm -rf ~/.gradle/caches
      # --no-parallel: відомий Gradle race condition при паралельній обробці одного jar
      # кількома підпроєктами одночасно ламає створення кеш-файлу (bcprov-jdk18on тощо).
      # --max-workers=1 додатково прибирає паралелізм на рівні воркерів.
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --no-parallel --max-workers=1 --refresh-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: EuroClub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
