name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - run: rm -rf ~/.gradle/caches ~/.gradle/wrapper
      - name: Build APK (retry up to 3x, flaky jar download)
        run: |
          cd android && chmod +x gradlew
          success=false
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon --no-parallel --max-workers=1 --refresh-dependencies; then
              success=true
              break
            fi
            echo "Attempt $i failed, retrying..."
            rm -rf ~/.gradle/caches
            sleep 5
          done
          if [ "$success" != "true" ]; then
            echo "All build attempts failed"
            exit 1
          fi
      - name: Debug - list APK outputs
        run: find android/app/build/outputs -type f
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: EuroClub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
