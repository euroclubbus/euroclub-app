name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      # Битий/неповний Gradle-кеш на раннері іноді ламає завантаження конкретних jar
      # (напр. bcprov-jdk18on) — примусово чистимо кеш перед збіркою, щоб усе тягнулось заново.
      - run: rm -rf ~/.gradle/caches
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --refresh-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: EuroClub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
